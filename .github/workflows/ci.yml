name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint & types (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff
        run: |
          ruff check src/ tests/ scripts/
          ruff format --check src/ tests/ scripts/
      - name: Mypy
        run: mypy src/chaff_generator/

  tests:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      # Headless Qt for the GUI test suite.
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Pytest
        run: python -m pytest -q

  # Free-space-fill benchmarks are never run in CI (spec section 82).
  bundles:
    name: PyInstaller (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [quality, tests]
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Build CLI bundle (with smoke check)
        run: python scripts/build.py --cli
      - name: Build GUI bundle
        run: python scripts/build.py --gui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chaff-bundles-${{ matrix.os }}
          path: dist/
          retention-days: 7
