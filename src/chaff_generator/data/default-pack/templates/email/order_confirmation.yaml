id: email.order_confirmation
kind: email
description: Order confirmation with line items and delivery estimate.
domains: [sales, finance]
body:
  subject: "Order confirmed - ORD-{{ integer(10000, 99999) }}"
  from_name: "{{ organization.name }} Orders"
  to_name: "{{ contact.full_name }}"
  category: order
  body_paragraphs:
    - "Dear {{ contact.first_name }},"
    - "Thank you for your order ORD-{{ integer(10000, 99999) }} placed on {{ date_recent(5) }}."
    - "Items:"
    - "- {{ product.name }} x{{ integer(1, 6) }} - {{ money(20, 900) }}"
    - "- {{ word('products') }} x{{ integer(1, 3) }} - {{ money(10, 300) }}"
    - "Order total: {{ money(35, 2100) }} (tax included)."
    - "Estimated delivery to {{ client.city }}: {{ date_recent(1) }} plus {{ integer(3, 14) }} business days."
    - "{{ sentence('support') }}"
    - "{{ pick('closings') }}"
  signature: "Orders Team\n{{ organization.name }}"
